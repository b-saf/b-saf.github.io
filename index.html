<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background: #0f172a; color: white; text-align: center; }

        .section { padding: 50px 10%; background: white; color: #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { padding: 20px; border: 1px solid #e2e8f0; border-radius: 10px; }

    <nav><strong>BSAF</strong></nav>

        <div class="grid">
            <div class="card"><h3>Client Traffic</h3><p>Optimized strategies to grow your business presence.</p></div>
            <div class="card"><h3>Consulting</h3><p>Expert industry-grade guidance for scaling.</p></div>
